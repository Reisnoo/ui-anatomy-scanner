<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>陽性対照（自作・違反例）</title>
<style>
body{margin:0;padding:32px 48px;font:16px/1.7 sans-serif;color:#222;background:#fff;max-width:1100px}
h1{font-size:26px;margin:0 0 16px}section{margin:24px 0}
.lowA{color:#aaa;font-size:14px}.lowB{color:#999;background:#eee;font-size:16px;padding:4px 8px}.good{color:#333}
.warn{background:#ffc800;color:#fff;font-weight:700;font-size:18px;border:0;padding:10px 18px}
.tiny{width:16px;height:16px;border:1px solid #333;background:#fff;padding:0;margin:0 2px 0 0}
.big{width:44px;height:44px}.ic{width:40px;height:40px;border:1px solid #888;background:#fff;margin-right:8px}
input{padding:8px;border:1px solid #888;margin:4px 0;display:block;width:320px}
</style></head><body>
<h1>陽性対照ページ（ツールが違反を拾えるかの確認用）</h1>
<section><h2>画像（alt なし3・あり1）</h2>
<img width="60" height="60" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='60' height='60'%3E%3Crect width='60' height='60' fill='%2393c5fd'/%3E%3C/svg%3E">
<img width="60" height="60" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='60' height='60'%3E%3Crect width='60' height='60' fill='%23fca5a5'/%3E%3C/svg%3E">
<img width="60" height="60" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='60' height='60'%3E%3Crect width='60' height='60' fill='%2386efac'/%3E%3C/svg%3E">
<img width="60" height="60" alt="代替テキストあり" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='60' height='60'%3E%3Crect width='60' height='60' fill='%23fcd34d'/%3E%3C/svg%3E"></section>
<section><h2>アイコンのみのボタン（名前なし3・あり4）</h2>
<button class="ic"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 4h16v16H4z" fill="none" stroke="#333" stroke-width="2"/></svg></button>
<button class="ic"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#333" stroke-width="2"/></svg></button>
<a class="ic" href="#" role="button" style="display:inline-block;box-sizing:border-box;vertical-align:top"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 20L12 4l8 16z" fill="none" stroke="#333" stroke-width="2"/></svg></a>
<button class="ic" aria-label="検索"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="#333" stroke-width="2"/></svg></button>
<button class="ic" title="設定"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12h14" stroke="#333" stroke-width="2"/></svg></button>
<button class="ic"><img width="20" height="20" alt="閉じる" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='20' height='20'%3E%3Cpath d='M3 3l14 14M17 3L3 17' stroke='%23333' stroke-width='2'/%3E%3C/svg%3E"></button>
<span id="lbl">お気に入り</span><button class="ic" aria-labelledby="lbl"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z" fill="none" stroke="#333" stroke-width="2"/></svg></button></section>
<section><h2>文字のコントラスト（不足4・十分1）</h2>
<p class="lowA">淡いグレーの小さな文字（#aaa on white）</p>
<p class="lowA">もう一つの淡い文字です。</p>
<p><span class="lowB">灰色背景に灰色の文字</span></p>
<p><button class="warn">黄色に白い太字</button></p>
<p class="good">十分なコントラストの文字（#333 on white）</p></section>
<section><h2>小さな操作領域（隣接2・孤立1・十分1）</h2>
<div><button class="tiny" aria-label="a"></button><button class="tiny" aria-label="b"></button></div>
<div style="margin-top:40px"><button class="tiny" aria-label="孤立した小さなボタン"></button></div>
<div style="margin-top:40px"><button class="big" aria-label="十分な大きさ"></button></div></section>
<section><h2>入力欄（プレースホルダのみ2・ラベルあり1）</h2>
<input type="text" placeholder="氏名"><input type="text" placeholder="メールアドレス">
<label for="x">ラベルつき</label><input id="x" type="text"></section>
</body></html>
