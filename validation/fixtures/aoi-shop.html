<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>AOI test shop</title>
<style>
body{margin:0;font-family:sans-serif;background:#f6f7f5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:20px 28px}
.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:7px}
.thumb{height:90px;background:#eef1f5}
.add-btn{height:34px;border-radius:8px;background:#2b5fcb;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0 14px}
.add-btn::after{content:"カートに追加"}
.choice-list{display:flex;flex-direction:column;gap:12px;max-width:560px;padding:0 28px}
.choice-card{background:#fff;border:2px solid #ddd;border-radius:10px;padding:17px 19px;cursor:pointer;display:block}
</style></head><body>
<input type="checkbox" id="a1" style="display:none"><input type="checkbox" id="a2" style="display:none"><input type="checkbox" id="a3" style="display:none">
<div class="grid">
 <div class="card aoi-decoy"><div class="thumb"></div><div>有線ヘッドホン</div><label class="add-btn" for="a1"></label></div>
 <div class="card" id="aoi-target"><div class="thumb"></div><div>Bluetoothイヤホン（黒）</div><label class="add-btn" for="a2"></label></div>
 <div class="card aoi-decoy"><div class="thumb"></div><div>ラジオ</div><label class="add-btn" for="a3"></label></div>
</div>
<div class="choice-list"><label class="choice-card" for="a1"><div>自宅</div></label><label class="choice-card" for="a2"><div>実家</div></label><label class="choice-card" for="a3"><div>オフィス</div></label></div>
</body></html>
