<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>対照（アニメーションで現れる要素）</title>
<style>
body{margin:0;padding:32px 48px;font:16px/1.7 sans-serif;color:#222;background:#fff;max-width:1000px}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}
/* 基本は opacity:0 で、アニメーションの終了後に見える作り。終了後は見えているので、低コントラストの文字は指摘すべき */
.reveal{opacity:0;animation:fadeUp .4s ease forwards}
.hint{font-size:11px;color:rgba(15,28,46,.55)}
</style></head><body>
<h1>アニメーションで現れる要素は、終了後の状態で判定する</h1>
<p>見えている十分なコントラストの文字（指摘されない）</p>
<div class="reveal"><p class="hint">Scroll to explore（終了後は見えている淡く小さな文字。指摘される＝正しい検出）</p></div>
</body></html>
