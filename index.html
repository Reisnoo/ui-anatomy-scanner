/* ============================================================
   レポート出力
   ============================================================ */
function buildReport(){
  const d=new Date().toISOString().slice(0,10);
  let m=`# UI分析レポート：${S.sourceName}\n\n- 日付: ${d}\n- 生成: UI Anatomy Scanner（プロトタイプ）\n- 注意: ルールベースの推定であり、実ユーザーテストの代替ではありません。視線は実測ではなく仮想です。\n\n## 構成要素\n\n`;
  const by={}; S.comps.forEach(c=>{ by[c.type]=(by[c.type]||0)+1; });
  m+=Object.keys(TYPES).filter(t=>by[t]).map(t=>`- ${TYPES[t].ja}: ${by[t]}`).join('\n')+'\n\n## ニールセン10原則\n\n| 原則 | スコア |\n|---|---|\n'+NIELSEN.map(h=>`| ${h.id} ${h.ja} | ${hScore(h.id)} |`).join('\n')+'\n';
  [...NIELSEN,SUP].forEach(h=>{ const l=S.issues.filter(i=>i.h===h.id && isActive(i)); if(!l.length) return;
    m+=`\n### ${h.id==='SUP'?'補助':h.id} ${h.ja}\n\n`;
    l.forEach(i=>{ m+=`- **[重大度${i.sev}] ${i.title}**${i.auto?'':'（手動判定）'}\n`; if(i.detail) m+=`  - 内容: ${i.detail}\n`; if(i.evidence.length) m+=`  - 根拠: ${i.evidence.join(' / ')}\n`; if(i.fix) m+=`  - 改善案: ${i.fix}\n`; });
  });
  const g=S.gaze; if(g.fix.length){ m+=`\n## 仮想視線（${PERSONAS[g.persona].name} / ${TASKS[g.task]}）\n\n- 総注視時間: ${(g.fix.reduce((a,b)=>a+b.dur,0)/1000).toFixed(1)}s、注視${g.fix.length}回\n- 注視順: ${g.fix.map((x,i)=>`${i+1}.${x.target.label}`).join(' → ')}\n`; }
  if(S.lens.on){ const L=S.lens, n2=S.lensList.filter(l=>l.level===2).length, n1=S.lensList.filter(l=>l.level===1).length;
    m+=`\n## Age Lens（${L.preset&&LENS_PRESETS[L.preset]?LENS_PRESETS[L.preset].name:'カスタム'}）\n\n- ぼやけ ${L.blur}px／コントラスト ${Math.round(L.contrast*100)}%／黄変 ${Math.round(L.yellow*100)}%／視野狭窄 ${Math.round(L.tunnel*100)}%／色覚 ${CVD_JA[L.cvd]}\n- 読みにくい文字: 重大 ${n2}件、注意 ${n1}件。押しにくい操作領域(<44px): ${S.lensTap.length}件\n- 簡易シミュレーションであり、医学的な再現ではありません。\n`;
    S.lensList.slice(0,8).forEach(l=>{ m+=`  - [${l.level===2?'重大':'注意'}] ${l.label}（${Math.round(l.fs)}px, ${l.base.toFixed(1)}→${l.ratio.toFixed(1)}:1）\n`; });
  }
  return m;
}

/* ============================================================
   入力UI
   ============================================================ */
function renderSrc(){
  const b=$('#srcBody');
  if(S.srcMode==='sample'){
    b.innerHTML=`<div class="sample-grid">${SAMPLES.map(s=>`<button class="sample" data-sample="${s.key}" aria-pressed="${S.sampleKey===s.key}"><b>${s.name}</b><span>${s.desc}</span></button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn ghost" id="cmpDemo">Before/After デモを開く（ECストア → 改善版）</button></div><p class="hint">サンプルは架空のサイトです。ヒューリスティクスの弱点を意図的に仕込んでいます。</p>`;
  } else if(S.srcMode==='url'){
    b.innerHTML=`<div class="row"><input type="url" id="urlIn" placeholder="https://example.com/" aria-label="解析するURL"><button class="btn" id="urlGo">解析する</button></div>
    <details style="margin-top:8px"><summary class="hint" style="cursor:pointer">中継(プロキシ)URLを設定する（任意）</summary><div class="row" style="margin-top:6px"><input type="url" id="proxyIn" placeholder="https://your-worker.example.workers.dev/?url={url}" aria-label="中継URL"></div></details>
    <p class="hint">他サイトのHTMLはブラウザからは直接取得できないことが多い（CORS）ため、自分で用意した中継を指定するか、「HTML貼り付け」をご利用ください。スクリプトは実行せず、HTMLとCSSのみで描画します。</p>`;
  } else {
    b.innerHTML=`<textarea id="htmlIn" placeholder="<!doctype html> … ページのHTMLを貼り付け（ブラウザの「ページのソースを表示」からコピー）" aria-label="HTML"></textarea><div class="row" style="margin-top:8px"><button class="btn" id="htmlGo">解析する</button><span class="hint" style="margin:0">外部CSSは絶対URLなら読み込まれます</span></div>`;
  }
}

/* ============================================================
   イベント
   ============================================================ */
document.addEventListener('click', e=>{
  const t=e.target.closest('button,[data-issue],.item'); if(!t) return;
  if(t.matches('.seg button')){ S.srcMode=t.dataset.src; $$('.seg button').forEach(b=>b.setAttribute('aria-selected',b===t)); renderSrc(); return; }
  if(t.matches('.tabs button')){
    S.tab=t.dataset.tab; Object.assign(S.show,{comps:S.tab==='comps', pins:S.tab==='heur', path:S.tab==='gaze', lensMap:S.tab==='lens', multi:S.tab==='multi'});
    if(S.tab==='lens' && !S.lens.on && !S.lens.preset){ setLensPreset('senior65'); renderTabs(); return; }
    applyLens(); syncToggles(); renderTabs(); renderPanel(); renderOverlay(); return;
  }
  if(t.dataset.ptab){ S.pTab=t.dataset.ptab; renderPanel(); return; }
  if(t.dataset.pactive){ const k=t.dataset.pactive; if(S.pActive.has(k)){ if(S.pActive.size>1) S.pActive.delete(k); else toast('1つ以上選んでください'); } else S.pActive.add(k); savePersonas(); S.multi=null; renderPanel(); renderOverlay(); return; }
  if(t.dataset.pload){ const P=PERSONAS[t.dataset.pload]; S.pEdit=draftFrom(P, !!P.custom); renderPanel(); return; }
  if(t.id==='pNew'){ S.pEdit=draftFrom(PERSONAS.worker,false,'新しいペルソナ'); renderPanel(); return; }
  if(t.id==='pSave'){ saveDraft(false); return; }
  if(t.id==='pSaveNew'){ saveDraft(true); return; }
  if(t.id==='pDel'){ deleteDraft(); return; }
  if(t.id==='pLensFrom4'){ const d=ensureDraft(), L=S.lens; d.lens={blur:L.blur,contrast:L.contrast,yellow:L.yellow,tunnel:L.tunnel,cvd:L.cvd,cvdS:L.cvdS}; renderPanel(); return; }
  if(t.id==='pLensTo4'){ const d=ensureDraft(); Object.assign(S.lens,d.lens,{preset:'custom',on:true}); if(S.lens.split===0||S.lens.split===100) S.lens.split=50; S.tab='lens'; Object.assign(S.show,{comps:false,pins:false,path:false,multi:false,lensMap:true}); syncToggles(); renderTabs(); lensChanged(true); return; }
  if(t.id==='pExport'){ const txt=JSON.stringify({version:1, personas:customKeys().map(exportPersona)},null,1); const ta=$('#pJson'); if(ta) ta.value=txt; navigator.clipboard.writeText(txt).then(()=>toast('書き出してコピーしました'),()=>toast('下の欄に書き出しました')); return; }
  if(t.id==='pImport'){ importPersonas(($('#pJson')||{value:''}).value); return; }
  if(t.id==='multiCopy'){ navigator.clipboard.writeText(buildMultiReport()).then(()=>toast('ペルソナ比較をコピーしました'),()=>toast('コピーに失敗しました')); return; }
  if(t.id==='saveBase'||t.id==='saveBase2'){ saveBase(); return; }
  if(t.id==='clearBase'){ S.base=null; frameCmp.srcdoc=''; updateBaseChip(); renderPanel(); renderOverlay(); return; }
  if(t.id==='swapBA'){ swapBA(); return; }
  if(t.id==='cmpDemo'||t.id==='cmpDemo2'){ cmpDemo(); return; }
  if(t.id==='cmpCopy'){ navigator.clipboard.writeText(buildCmpReport()).then(()=>toast('比較レポートをコピーしました'),()=>toast('コピーに失敗しました')); return; }
  if(t.id==='cmpDl'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buildCmpReport()],{type:'text/markdown'})); a.download='ui-before-after-report.md'; a.click(); return; }
  if(t.dataset.lensPreset){ setLensPreset(t.dataset.lensPreset); return; }
  if(t.dataset.lrect){ const l=S.lensList[+t.dataset.lrect]; if(l) scrollToRect(l.rect); return; }
  if(t.dataset.sample){ const s=SAMPLES.find(x=>x.key===t.dataset.sample); S.sampleKey=s.key; renderSrc(); loadHTML(s.build(), s.name); return; }
  if(t.id==='urlGo'){ loadURL($('#urlIn').value.trim(), $('#proxyIn')?.value.trim()); return; }
  if(t.id==='htmlGo'){ const v=$('#htmlIn').value; if(v.trim().length<20){ setStatus('HTMLを貼り付けてください', true); return; } loadHTML(v, '貼り付けたHTML'); return; }
  if(t.id==='themeBtn'){ toggleTheme(); return; }
  if(t.id==='copyReport'){ navigator.clipboard.writeText(buildReport()).then(()=>toast('レポートをコピーしました'),()=>toast('コピーに失敗しました')); return; }
  if(t.id==='dlReport'){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buildReport()],{type:'text/markdown'})); a.download='ui-analysis-report.md'; a.click(); return; }
  if(t.id==='gRetry'){ S.gaze.trial++; simulate(); renderPanel(); renderOverlay(); return; }
  if(t.id==='playBtn'){ if(S.gaze.timer) stopPlay(); else startPlay(); return; }
  if(t.id==='wReset'){ S.gaze.wV=S.gaze.wR=S.gaze.wP=null; simulate(); renderPanel(); renderOverlay(); return; }
  const act=t.dataset.act, id=t.dataset.issue;
  if(act && id){
    const is=S.issues.find(i=>i.id===id);
    if(act==='show'){ S.selIssue=id; S.show.pins=true; $('#tgPins').checked=true; scrollToRect(is.rects[0]); renderPanel(); renderOverlay(); }
    else if(act==='dismiss'){ is.state=is.state==='dismissed'?'open':'dismissed'; renderPanel(); renderOverlay(); }
    else if(act==='ng'){ is.state=is.state==='ng'?'unreviewed':'ng'; is.sev=is.state==='ng'?(is.msev||2):0; renderPanel(); renderOverlay(); }
    else if(act==='ok'){ is.state=is.state==='ok'?'unreviewed':'ok'; is.sev=0; renderPanel(); renderOverlay(); }
    return;
  }
});
document.addEventListener('click', e=>{
  const pin=e.target.closest('.pin'); if(pin){ const id=pin.dataset.issue; S.selIssue=id; S.tab='heur'; const is=S.issues.find(i=>i.id===id); S.openH.add(is.h); renderAll(); const el=$(`.issue[data-issue="${id}"]`); if(el) el.scrollIntoView({block:'center'}); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.type){ t.checked?S.hiddenTypes.delete(t.dataset.type):S.hiddenTypes.add(t.dataset.type); renderOverlay(); }
  else if(t.dataset.act==='msev'){ const is=S.issues.find(i=>i.id===t.dataset.issue); is.msev=+t.value; is.sev=+t.value; renderPanel(); renderOverlay(); }
  else if(t.id==='gPersona'){ S.gaze.persona=t.value; S.gaze.wV=S.gaze.wR=S.gaze.wP=null; S.gaze.trial=0; simulate(); renderPanel(); renderOverlay(); }
  else if(t.id==='gTask'){ S.gaze.task=t.value; S.gaze.trial=0; simulate(); renderPanel(); renderOverlay(); }
  else if(t.id==='gRange'){ S.gaze.range=t.value; S.gaze.trial=0; simulate(); renderPanel(); renderOverlay(); }
  else if(t.id==='cmpShow'){ S.cmp.show=t.checked; renderOverlay(); }
  else if(t.dataset.lens){ computeLens(); renderPanel(); }
  else if(t.id==='lOn'){ S.lens.on=t.checked; if(t.checked && !S.lens.preset) S.lens.preset='custom'; applyLens(); renderOverlay(); renderPanel(); }
  else if(t.id==='lCvd'){ S.lens.cvd=t.value; S.lens.preset='custom'; lensChanged(true); }
  else if(t.id==='gLens'){ S.gaze.useLens=t.checked; simulate(); renderPanel(); renderOverlay(); }
  else if(t.id==='tgLens'){ S.show.lensMap=t.checked; renderOverlay(); }
  else if(t.id==='tgMulti'){ S.show.multi=t.checked; renderOverlay(); }
  else if(t.id==='pSmall'){ ensureDraft().smallPenalty=t.checked; }
  else if(t.id==='pCvd'){ ensureDraft().lens.cvd=t.value; }
  else if(t.id==='pLensPreset'){ if(t.value){ const d=ensureDraft(); d.lens=Object.assign({},NEUTRAL_LENS,{blur:LENS_PRESETS[t.value].blur,contrast:LENS_PRESETS[t.value].contrast,yellow:LENS_PRESETS[t.value].yellow,tunnel:LENS_PRESETS[t.value].tunnel,cvd:LENS_PRESETS[t.value].cvd,cvdS:LENS_PRESETS[t.value].cvdS}); renderPanel(); } }
  else if(t.id==='mLens'){ S.multiLens=t.checked; renderPanel(); renderOverlay(); }
  else if(t.id==='tgComps'){ S.show.comps=t.checked; renderOverlay(); }
  else if(t.id==='tgPins'){ S.show.pins=t.checked; renderOverlay(); }
  else if(t.id==='tgPath'){ S.show.path=t.checked; renderOverlay(); }
  else if(t.id==='tgHeat'){ S.show.heat=t.checked; renderOverlay(); }
});
document.addEventListener('input', e=>{
  const lt=e.target;
  if(lt.dataset && (lt.dataset.pf||lt.dataset.pl)){ const d=ensureDraft(), k=lt.dataset.pf||lt.dataset.pl; if(lt.dataset.pf) d[k]=+lt.value; else d.lens[k]=+lt.value; const v=$('#pv_'+k); if(v) v.textContent=PFMAP[k](+lt.value); return; }
  if(lt.id==='pName'){ ensureDraft().name=lt.value; return; }
  if(lt.id==='pDesc'){ ensureDraft().descText=lt.value; return; }
  if(lt.dataset && lt.dataset.cmp==='split'){ S.cmp.split=+lt.value; const v=$('#cv_split'); if(v) v.textContent=lt.value+'%'; renderOverlay(); return; }
  if(lt.dataset && lt.dataset.lens){
    const k=lt.dataset.lens; S.lens[k]=+lt.value; if(k!=='split') S.lens.preset='custom'; else if(!S.lens.on) S.lens.on=true;
    const fm={blur:v=>v.toFixed(1)+'px', contrast:v=>Math.round(v*100)+'%', yellow:v=>Math.round(v*100)+'%', tunnel:v=>Math.round(v*100)+'%', cvdS:v=>Math.round(v*100)+'%', split:v=>v+'%'};
    const lv=$('#lv_'+k); if(lv) lv.textContent=fm[k](+lt.value);
    $$('.chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.lensPreset===S.lens.preset));
    lensChanged(false); return;
  }
  const t=e.target; if(t.dataset.w){ S.gaze[t.dataset.w]=+t.value; const v=$('#v_'+t.dataset.w); if(v) v.textContent=(+t.value).toFixed(2);
    clearTimeout(S._wt); S._wt=setTimeout(()=>{ simulate(); renderGazePanelLite(); renderOverlay(); },120); }
});
document.addEventListener('toggle', e=>{ const d=e.target; if(d.classList&&d.classList.contains('h-card')){ d.open?S.openH.add(d.dataset.h):S.openH.delete(d.dataset.h); } }, true);
document.addEventListener('mouseover', e=>{ const it=e.target.closest('.item[data-comp]'); const id=it?it.dataset.comp:null; if(id!==S.hlComp){ S.hlComp=id; renderOverlay(); } });

function syncToggles(){ $('#tgMulti').checked=S.show.multi; $('#tgLens').checked=S.show.lensMap; $('#tgComps').checked=S.show.comps; $('#tgPins').checked=S.show.pins; $('#tgPath').checked=S.show.path; $('#tgHeat').checked=S.show.heat; }
$('#stageScroll').addEventListener('mousemove', e=>{
  if(!(S.lens.on && S.lens.tunnel>0)) return;
  const sc=$('#stageScroll'), b=sc.getBoundingClientRect();
  S.lens.cx=Math.round((e.clientX-b.left+sc.scrollLeft)/S.scale); S.lens.cy=Math.round((e.clientY-b.top+sc.scrollTop)/S.scale);
  const R=780-660*S.lens.tunnel; $('#vig').style.background=`radial-gradient(circle at ${S.lens.cx}px ${S.lens.cy}px, rgba(0,0,0,0) ${R*.55}px, rgba(0,0,0,.9) ${R*1.2}px)`;
});
function scrollToRect(r){ if(!r) return; const sc=$('#stageScroll'); sc.scrollTo({top:Math.max(0, r.y*S.scale-90), behavior:'smooth'}); }

/* テーマ */
function toggleTheme(){ const d=document.documentElement; const next=d.dataset.theme==='dark'?'light':'dark'; d.dataset.theme=next; $('#themeBtn').innerHTML=ico(next==='dark'?'sun':'moon',18); try{ localStorage.setItem('uas-theme',next); }catch(e){} }
(function initTheme(){ let t=null; try{ t=localStorage.getItem('uas-theme'); }catch(e){} if(!t) t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; document.documentElement.dataset.theme=t; $('#themeBtn').innerHTML=ico(t==='dark'?'sun':'moon',18); })();

/* 起動 */
initPersonas();
renderSrc();
renderPanel();
(function boot(){ const s=SAMPLES[0]; S.sampleKey=s.key; renderSrc(); loadHTML(s.build(), s.name); })();
</script>
</body>
